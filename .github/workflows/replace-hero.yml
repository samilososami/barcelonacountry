name: Replace hero image

on:
  push:
    paths:
      - ".github/workflows/replace-hero.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild hero image
        run: |
          cat .hero/part-*.txt > /tmp/hero.b64
          base64 -d /tmp/hero.b64 > /tmp/hero.jpg
          if command -v magick >/dev/null 2>&1; then
            magick /tmp/hero.jpg public/assets/hero-bg.png
          elif command -v convert >/dev/null 2>&1; then
            convert /tmp/hero.jpg public/assets/hero-bg.png
          else
            sudo apt-get update
            sudo apt-get install -y imagemagick
            convert /tmp/hero.jpg public/assets/hero-bg.png
          fi

      - name: Commit hero replacement
        run: |
          rm -rf .hero
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace hero image"
          git push
